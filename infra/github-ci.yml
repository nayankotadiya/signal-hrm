name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - name: End-to-end smoke test against a real MongoDB
        env:
          APP_ENV: development
          PORT: "3100"
          MONGODB_URI: mongodb://localhost:27017/signalhrm
          STORAGE_PROVIDER: local
          LOCAL_STORAGE_DIR: /tmp/shrm-files
          OTP_DEV_ECHO: "true"
        run: |
          npm run build
          node dist/scripts/bootstrap-super-admin.js --org "CI Org" --name "CI Admin" --email nayan@bulletproof.test
          node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3100/api/v1/health/live && break; sleep 1; done
          API=http://localhost:3100/api API_LOG=/tmp/api.log npm run test:smoke

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.27.4 }
      - name: N UI
        working-directory: packages/n_ui
        run: flutter pub get && flutter analyze && flutter test
      - name: Web app
        working-directory: apps/web
        run: flutter pub get && flutter analyze && flutter test && flutter build web --release --no-web-resources-cdn --dart-define=APP_ENV=production
